<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Website Description -->
    <meta
      name="description"
      content="Play Poppy's Magical Garden, a cute and fun Whack-a-Mole game. Catch the sneaky moles and earn points before time runs out!"
    />

    <!-- Website Keywords -->
    <meta
      name="keywords"
      content="Whack-a-Mole, JavaScript game, Poppy's Magical Garden, fun game, browser game"
    />

    <!-- Page Title -->
    <title>Poppy's Magical Garden | Whack-a-Mole</title>

    <!-- Icons -->

    <!-- stylesheets -->
    <link rel="stylesheet" href="./styles/normalize-fwd.css" />
    <link rel="stylesheet" href="./styles/levels.css" />
    <link rel="stylesheet" href="./styles/common.css" />

    <!-- script files -->
    <script src="./script/main.js" defer></script>

  </head>
  <body>
    <a class="screen-reader-text" href="#main">Skip to content</a>
    <header>
      <p>Poppy's Magical Garden | Whack-a-Mole</p>
    </header>

    <main id="main">
     <h1>Welcome to Poppy's Magical Garden!</h1>
  
     <section class="game-info">
      <h2>Start Playing</h2>
      <div class="game-level">
      <div class="level-time">
      <p>Level : <span id="level"> Easy</span></p>
      <div class="game-level-images">
          <img src="./images/Poppy.png" alt="Easy Level">
          <img src="./images/Whole.png" alt="Whole">
          <img src="./images/Whole.png" alt="Whole">
      </div>
      </div>
       
      <div class="level-time">
      <p>Score</p>
      <p id="time-lift" class="time-lift">
        000
      </p>
      </div>
      <div class="level-time">
      <p>Time Lift</p>
      <p id="time-lift" class="time-lift">
        00 : 00
      </p>
      </div>
      </div>
      <a href="./index.html" class="back-to-start"> Reset Game</a>
     </section>
      
    </main>

    <footer>
      <p>&copy; 2026 Whack-a-Mole</p>
      <p>This site is for educational purposes only.</p>
    </footer>
  </body>
</html>
